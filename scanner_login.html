<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - สแกนเอกสารมือถือ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- 🚀 เรียกใช้ไฟล์ข้อมูลผู้ใช้ที่ Python สร้างให้เมื่อกี้ -->
    <script src="scanner_data.js"></script>
    
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        .logo { font-size: 50px; margin-bottom: 10px; }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 20px; text-align: left; position: relative; z-index: 100; }
        .input-group label { display: block; margin-bottom: 5px; color: #34495e; font-weight: 600; }
        
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
            letter-spacing: 5px;
        }
        .input-group input:focus { border-color: #3498db; }

        .user-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            font-family: 'Sarabun', sans-serif;
            background-color: #ffffff;
            color: #2c3e50;
            outline: none;
            cursor: pointer;
            appearance: none; 
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2334495e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
        }
        .user-select option { background-color: #ffffff; color: #2c3e50; font-size: 16px; }
        .user-select:focus { border-color: #3498db; }
        
        .btn-login {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover { background-color: #2980b9; }
        
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">📷</div>
        <h2>ระบบสแกนเอกสาร</h2>
        <p>กรุณาระบุตัวตนก่อนเข้าใช้งาน</p>
        
        <div class="input-group">
            <label>ผู้ทำรายการ:</label>
            <select id="userSelect" class="user-select">
                <!-- รายชื่อจะถูกเติมด้วย Javascript ด้านล่าง -->
            </select>
        </div>
        
        <div class="input-group" style="z-index: 10;">
            <label>รหัสผ่านเข้าใช้งาน:</label>
            <!-- ลบ inputmode=numeric ออก เผื่อรหัสผ่านมีตัวอักษรภาษาอังกฤษ -->
            <input type="password" id="pinInput" placeholder="••••" onkeypress="checkEnter(event)">
        </div>
        
        <button class="btn-login" onclick="verifyLogin()">เข้าสู่ระบบ</button>
        <div class="error-msg" id="errorText">❌ รหัสผ่านไม่ถูกต้อง!</div>
    </div>

    <script>
        // 🚀 โหลดรายชื่อจากไฟล์ scanner_data.js ที่ Python เตรียมไว้ให้
        const select = document.getElementById('userSelect');
        
        if (typeof ALL_USERS !== 'undefined' && ALL_USERS.length > 0) {
            ALL_USERS.forEach(u => {
                if(u.user && u.name) {
                    let opt = document.createElement('option');
                    opt.value = u.user; // ใช้ ไอดี(Username) เป็นค่าที่เลือก
                    opt.textContent = `${u.name} (ไอดี: ${u.user})`; // โชว์ ชื่อ (ไอดี) ให้เห็นชัดเจน
                    select.appendChild(opt);
                }
            });

            // ตั้งค่าเริ่มต้นเป็นคนปัจจุบันที่เปิดหน้าเว็บขึ้นมา
            if (typeof CURRENT_USER !== 'undefined') {
                for (let i = 0; i < select.options.length; i++) {
                    if (select.options[i].text.includes(CURRENT_USER)) {
                        select.selectedIndex = i;
                        break;
                    }
                }
            }
        } else {
            let opt = document.createElement('option');
            opt.textContent = "-- ไม่พบข้อมูลในระบบ --";
            select.appendChild(opt);
        }

        function verifyLogin() {
            const inputPass = document.getElementById("pinInput").value;
            const errorText = document.getElementById("errorText");
            const selectedUserId = document.getElementById("userSelect").value; 
            
            // 🚀 ค้นหาไอดีที่เลือก แล้วตรวจรหัสผ่านให้ตรงกับฐานข้อมูลเป๊ะๆ
            const user = ALL_USERS.find(u => u.user === selectedUserId);
            
            if (user && inputPass === user.pass) {
                // ✅ รหัสถูกต้อง! ส่งชื่อเต็มๆ ไปโชว์ในหน้าสแกน
                window.location.href = `index.html?user=${encodeURIComponent(user.name)}`;
            } else {
                // ❌ รหัสผิด เด้งแจ้งเตือน
                errorText.style.display = "block";
                document.getElementById("pinInput").value = "";
                document.getElementById("pinInput").focus();
            }
        }

        function checkEnter(event) {
            if (event.key === "Enter") {
                verifyLogin();
            }
        }
    </script>
</body>
</html>
