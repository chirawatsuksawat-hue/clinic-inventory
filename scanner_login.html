<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เข้าสู่ระบบ - Smart Inventory</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            margin: 0; 
            height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .login-container { 
            background: rgba(255, 255, 255, 0.95); 
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            text-align: center; 
            width: 90%; 
            max-width: 380px; 
            position: relative; 
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.5);
        }

        .logo-box {
            background: linear-gradient(135deg, #3498db, #2980b9);
            width: 80px;
            height: 80px;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 20px auto;
            box-shadow: 0 10px 20px rgba(52, 152, 219, 0.3);
            transform: rotate(-5deg);
        }

        .logo { font-size: 40px; color: white; transform: rotate(5deg); }
        
        h3 { color: #2c3e50; font-size: 26px; font-weight: 700; margin-top: 0; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 15px; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: left; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; color: #34495e; font-weight: 600; font-size: 0.9rem; }
        
        .input-icon {
            position: absolute;
            left: 15px;
            top: 42px;
            color: #95a5a6;
            font-size: 1.1rem;
        }

        .user-select, .pin-input { 
            width: 100%; 
            padding: 14px 15px 14px 45px; 
            border: 2px solid #e0e6ed; 
            border-radius: 12px; 
            font-size: 16px; 
            font-family: 'Sarabun', sans-serif; 
            background-color: #f8fafc; 
            color: #2c3e50; 
            outline: none; 
            box-sizing: border-box;
            transition: all 0.3s;
            appearance: none; 
        }
        
        .pin-input { padding-left: 45px; letter-spacing: 5px; font-weight: bold; }
        
        .user-select:focus, .pin-input:focus { 
            border-color: #3498db; 
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1);
        }

        .select-arrow {
            position: absolute;
            right: 15px;
            top: 42px;
            color: #95a5a6;
            pointer-events: none;
        }

        .btn-login { 
            background: linear-gradient(135deg, #3498db, #2980b9); 
            color: white; 
            border: none; 
            padding: 15px; 
            width: 100%; 
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: bold; 
            cursor: pointer; 
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
            transition: all 0.2s;
            margin-top: 10px;
        }
        .btn-login:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(52, 152, 219, 0.5); }
        .btn-login:active { transform: translateY(1px); }

        .error-msg { 
            color: #e74c3c; 
            background: #fdf2f0;
            padding: 10px;
            border-radius: 8px;
            font-size: 14px; 
            margin-top: 15px; 
            display: none; 
            font-weight: bold; 
            border: 1px solid #fadbd8;
            animation: shake 0.4s;
        }

        @keyframes shake {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        #loadingOverlay { 
            position: absolute; 
            top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.95); 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            border-radius: 24px; 
            z-index: 999; 
            font-weight: bold; 
            color: #3498db; 
        }

        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(52, 152, 219, 0.2);
            border-top: 4px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="login-container">
        <div id="loadingOverlay">
            <div class="spinner"></div>
            <span id="loadingText">กำลังเชื่อมต่อฐานข้อมูล... ☁️</span>
        </div>

        <div class="logo-box">
            <i class="fas fa-boxes logo"></i>
        </div>
        
        <h3>Smart Inventory</h3>
        <p>กรุณาระบุตัวตนก่อนเข้าใช้งานระบบ</p>
        
        <div class="input-group">
            <label>ระบุผู้ทำรายการ</label>
            <i class="fas fa-user input-icon"></i>
            <select id="userSelect" class="user-select">
                <option value="">-- กำลังโหลดรายชื่อ --</option>
            </select>
            <i class="fas fa-chevron-down select-arrow"></i>
        </div>
        
        <div class="input-group">
            <label>รหัสผ่าน (PIN)</label>
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="pinInput" class="pin-input" placeholder="••••" inputmode="numeric" pattern="[0-9]*" onkeypress="checkEnter(event)">
        </div>
        
        <button class="btn-login" onclick="verifyLogin()">
            <i class="fas fa-sign-in-alt me-2"></i> เข้าสู่ระบบ
        </button>
        
        <div class="error-msg" id="errorText">
            <i class="fas fa-exclamation-circle me-1"></i> รหัสผ่านไม่ถูกต้อง!
        </div>
    </div>

    <script>
        // เคลียร์ Session เก่าทิ้งทันที
        sessionStorage.removeItem('inventory_auth_user');

        const firebaseConfig = {
            databaseURL: "https://dialysis-inventory-fab4e-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        let ALL_USERS = [];
        
        const loadTimeout = setTimeout(() => {
            document.getElementById('loadingText').innerHTML = "<span class='text-danger'>การเชื่อมต่อล่าช้า กรุณารีเฟรชหน้าจอ</span>";
        }, 8000);

        // 🚀 ดึงข้อมูลโดยตรง (ไม่ผ่าน Auth เพราะฐานข้อมูลเปิดให้เข้าแล้ว)
        db.ref('users_data').once('value').then((snapshot) => {
            clearTimeout(loadTimeout);
            const data = snapshot.val();
            const select = document.getElementById('userSelect');
            select.innerHTML = ''; 
            
            if (data && data.length > 0) {
                ALL_USERS = data;
                
                let defaultOpt = document.createElement('option');
                defaultOpt.value = "";
                defaultOpt.textContent = "-- กรุณาเลือกผู้ใช้งาน --";
                select.appendChild(defaultOpt);

                data.forEach(u => {
                    const userId = u.user || u.username || u.id || "";
                    const userName = u.name || u.fullname || "ไม่ระบุชื่อ";
                    
                    if(userId !== "") {
                        let opt = document.createElement('option');
                        opt.value = String(userId);
                        opt.textContent = userName + " (" + userId + ")";
                        select.appendChild(opt);
                    }
                });
            } else {
                let opt = document.createElement('option');
                opt.value = "";
                opt.textContent = "-- ไม่พบข้อมูลในระบบ --";
                select.appendChild(opt);
            }
            
            document.getElementById('loadingOverlay').style.display = 'none';
            
        }).catch((error) => {
            clearTimeout(loadTimeout);
            console.error("Firebase Error:", error);
            const overlay = document.getElementById('loadingOverlay');
            overlay.innerHTML = "<i class='fas fa-exclamation-triangle fa-3x mb-3 text-danger'></i><br><span class='text-danger'>ไม่สามารถเชื่อมต่อ Cloud ได้<br>โปรดตรวจสอบอินเทอร์เน็ต</span>";
        });

        function verifyLogin() {
            const inputPass = document.getElementById("pinInput").value;
            const errorText = document.getElementById("errorText");
            const selectedUserId = String(document.getElementById("userSelect").value); 
            
            if (!selectedUserId) {
                showError("กรุณาเลือกผู้ทำรายการก่อนครับ");
                return;
            }

            if (!inputPass) {
                showError("กรุณากรอกรหัสผ่าน (PIN)");
                return;
            }
            
            const user = ALL_USERS.find(u => (String(u.user) === selectedUserId || String(u.username) === selectedUserId || String(u.id) === selectedUserId));
            
            if (user) {
                const dbPass = String(user.pass || user.password || "");
                if (inputPass === dbPass) {
                    errorText.style.display = "none";
                    document.getElementById('loadingOverlay').style.display = 'flex';
                    document.getElementById('loadingText').innerText = 'กำลังพาท่านเข้าสู่ระบบ...';
                    
                    // ป้องกันการแฮกเข้าลิงก์ตรง ด้วย sessionStorage
                    const userNameToSave = user.name || user.fullname || selectedUserId;
                    sessionStorage.setItem('inventory_auth_user', userNameToSave);
                    
                    setTimeout(() => {
                        window.location.replace("index.html");
                    }, 500);
                    return;
                }
            }
            
            showError("รหัสผ่านไม่ถูกต้อง!");
        }

        function showError(msg) {
            const errorText = document.getElementById("errorText");
            const pinElem = document.getElementById("pinInput");
            
            errorText.innerHTML = `<i class="fas fa-exclamation-circle me-1"></i> ${msg}`;
            errorText.style.display = "block";
            pinElem.value = "";
            pinElem.focus();
            
            errorText.style.animation = 'none';
            errorText.offsetHeight; 
            errorText.style.animation = null; 
        }

        function checkEnter(event) {
            if (event.key === "Enter") { verifyLogin(); }
        }
    </script>
</body>
</html>
