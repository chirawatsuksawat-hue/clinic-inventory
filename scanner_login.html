<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - สแกนเอกสารมือถือ</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Sarabun', sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background: white;
            padding: 40px 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 350px;
        }
        .logo { font-size: 50px; margin-bottom: 10px; }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        
        .input-group { margin-bottom: 20px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; color: #34495e; font-weight: 600; }
        
        /* สไตล์สำหรับช่องใส่รหัส */
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
            text-align: center;
            letter-spacing: 5px;
        }
        .input-group input:focus { border-color: #3498db; }

        /* 🚀 สไตล์ใหม่สำหรับ Dropdown เลือกชื่อ */
        .user-select {
            width: 100%;
            padding: 12px;
            border: 2px solid #bdc3c7;
            border-radius: 8px;
            font-size: 16px; /* 16px ป้องกันบั๊ก Safari ในมือถือแอบซูมจอ */
            font-family: 'Sarabun', sans-serif;
            background-color: #ffffff; /* บังคับพื้นหลังสีขาวทึบ */
            color: #2c3e50;
            outline: none;
            cursor: pointer;
            /* แต่งลูกศร Dropdown ใหม่ให้มาตรฐานเท่ากันทุกเครื่อง */
            appearance: none; 
            -webkit-appearance: none;
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%2334495e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>');
            background-repeat: no-repeat;
            background-position: right 15px center;
        }
        .user-select option {
            background-color: #ffffff;
            color: #2c3e50;
            font-size: 16px;
        }
        .user-select:focus { border-color: #3498db; }
        
        .btn-login {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-login:hover { background-color: #2980b9; }
        
        .error-msg {
            color: #e74c3c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="logo">📷</div>
        <h2>ระบบสแกนเอกสาร</h2>
        <p>กรุณาระบุตัวตนก่อนเข้าใช้งาน</p>
        
        <!-- 🚀 เพิ่ม style="position: relative; z-index: 100;" ให้อยู่ชั้นบนสุด -->
        <div class="input-group" style="position: relative; z-index: 100;">
            <label>ผู้ทำรายการ:</label>
            <select id="userSelect" class="user-select">
                <option value="เจ้าหน้าที่ (ไม่ระบุชื่อ)">-- กรุณาเลือกชื่อของคุณ --</option>
            </select>
        </div>
        
        <!-- 🚀 เพิ่ม style="position: relative; z-index: 10;" ให้อยู่ชั้นล่างกว่า จะได้ไม่แทงทะลุขึ้นมา -->
        <div class="input-group" style="position: relative; z-index: 10;">
            <label>รหัสผ่าน (PIN):</label>
            <input type="password" id="pinInput" inputmode="numeric" placeholder="••••" onkeypress="checkEnter(event)">
        </div>
        
        <button class="btn-login" onclick="verifyLogin()">เข้าสู่ระบบ</button>
        <div class="error-msg" id="errorText">❌ รหัสผ่านไม่ถูกต้อง!</div>
    </div>

    <script>
        const SECRET_PIN = "1234"; // รหัสผ่านเข้าหน้าสแกน

        // 🚀 ดึงรายชื่อพนักงานจาก database.json ในคอมพิวเตอร์มาแสดงอัตโนมัติ
        fetch('database.json')
            .then(response => response.json())
            .then(data => {
                const users = data.users || [];
                const select = document.getElementById('userSelect');
                
                // เอาชื่อทุกคนมาใส่ใน Dropdown
                users.forEach(u => {
                    if(u.name) {
                        let opt = document.createElement('option');
                        opt.value = u.name;
                        opt.textContent = u.name;
                        select.appendChild(opt);
                    }
                });

                // ดักจับชื่อจาก URL (กรณีเปิดหน้าเว็บผ่านปุ่มในโปรแกรมคอมพิวเตอร์)
                const urlParams = new URLSearchParams(window.location.search);
                const urlUser = urlParams.get('user');
                if (urlUser) {
                    for (let i = 0; i < select.options.length; i++) {
                        if (select.options[i].value === urlUser) {
                            select.selectedIndex = i;
                            break;
                        }
                    }
                }
            })
            .catch(err => console.log("ไม่สามารถโหลดรายชื่อได้"));

        function verifyLogin() {
            const input = document.getElementById("pinInput").value;
            const errorText = document.getElementById("errorText");
            const selectedUser = document.getElementById("userSelect").value; // ดึงชื่อที่เลือก
            
            if (input === SECRET_PIN) {
                // 🚀 ถ้ารหัสถูก ให้พาไปหน้าสแกน พร้อมแนบชื่อที่เลือกไปด้วย!
                window.location.href = `index.html?user=${encodeURIComponent(selectedUser)}`;
            } else {
                errorText.style.display = "block";
                document.getElementById("pinInput").value = "";
                document.getElementById("pinInput").focus();
            }
        }

        function checkEnter(event) {
            if (event.key === "Enter") {
                verifyLogin();
            }
        }
    </script>
</body>
</html>
