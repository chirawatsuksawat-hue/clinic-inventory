<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - สแกนเอกสาร</title>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- 🚀 เพิ่มตัวอ่านไอคอน (FontAwesome) ตรงนี้ครับ! -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 🚀 เรียกใช้ Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Sarabun', sans-serif; background-color: #f4f6f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-container { background: white; padding: 40px 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 350px; position: relative; }
        .logo { font-size: 55px; margin-bottom: 10px; color: #3498db; /* 💡 เพิ่มสีฟ้าให้ไอคอน */ }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 5px; }
        h3 { color: #2c3e50; font-size: 24px; margin-top: 0; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; text-align: left; position: relative; z-index: 100; }
        .input-group label { display: block; margin-bottom: 5px; color: #34495e; font-weight: 600; }
        .input-group input { width: 100%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; text-align: center; letter-spacing: 5px; }
        .input-group input:focus { border-color: #3498db; }
        .user-select { width: 100%; padding: 12px; border: 2px solid #bdc3c7; border-radius: 8px; font-size: 16px; font-family: 'Sarabun', sans-serif; background-color: #ffffff; color: #2c3e50; outline: none; cursor: pointer; }
        .user-select:focus { border-color: #3498db; }
        .btn-login { background-color: #3498db; color: white; border: none; padding: 14px; width: 100%; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-login:hover { background-color: #2980b9; }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 10px; display: none; font-weight: bold; }
        #loadingOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.9); display: flex; justify-content: center; align-items: center; border-radius: 15px; z-index: 999; font-weight: bold; color: #3498db; }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- 🚀 หน้าต่างโหลดข้อมูลจาก Cloud -->
        <div id="loadingOverlay">กำลังเชื่อมต่อฐานข้อมูล Cloud... ☁️</div>

        <!-- 🚀 แก้ไขไอคอนตรงนี้ ใช้คลาส logo เพื่อขยายขนาด -->
        <i class="fas fa-boxes logo"></i>
        <h3>ระบบจัดการสต๊อก</h3>
        <p>กรุณาระบุตัวตนก่อนเข้าใช้งาน</p>
        
        <div class="input-group">
            <label>ผู้ทำรายการ:</label>
            <select id="userSelect" class="user-select">
                <option>-- กำลังโหลดรายชื่อ --</option>
            </select>
        </div>
        
        <div class="input-group" style="z-index: 10;">
            <label>รหัสผ่านเข้าใช้งาน:</label>
            <input type="password" id="pinInput" placeholder="••••" onkeypress="checkEnter(event)">
        </div>
        
        <button class="btn-login" onclick="verifyLogin()">เข้าสู่ระบบ</button>
        <div class="error-msg" id="errorText">❌ รหัสผ่านไม่ถูกต้อง!</div>
    </div>

    <script>
        // 🚀 ตั้งค่าการเชื่อมต่อ Firebase Database (ลิงก์เดียวกับโปรแกรมคอม)
        const firebaseConfig = {
            databaseURL: "https://dialysis-inventory-fab4e-default-rtdb.asia-southeast1.firebasedatabase.app/"
        };
        
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();
        let ALL_USERS = [];

        // 🚀 ดึงรายชื่อจาก Firebase แบบ Real-time ทันทีที่เปิดหน้าเว็บ!
        db.ref('users_data').once('value').then((snapshot) => {
            const data = snapshot.val();
            const select = document.getElementById('userSelect');
            select.innerHTML = ''; // ล้างค่าเดิม
            
            if (data && data.length > 0) {
                ALL_USERS = data;
                data.forEach(u => {
                    const userId = u.user || u.username || u.id || "";
                    const userName = u.name || u.fullname || "ไม่ระบุชื่อ";
                    
                    if(userId !== "") {
                        let opt = document.createElement('option');
                        opt.value = String(userId);
                        opt.textContent = userName + " (ไอดี: " + userId + ")";
                        select.appendChild(opt);
                    }
                });
            } else {
                let opt = document.createElement('option');
                opt.textContent = "-- ไม่พบข้อมูลในระบบ --";
                select.appendChild(opt);
            }
            
            // ปิดหน้าจอโหลดเมื่อดึงข้อมูลเสร็จ
            document.getElementById('loadingOverlay').style.display = 'none';
            
        }).catch((error) => {
            console.error("Firebase Error:", error);
            document.getElementById('loadingOverlay').innerText = "❌ ไม่สามารถเชื่อมต่อ Cloud ได้";
            document.getElementById('loadingOverlay').style.color = "red";
        });

        function verifyLogin() {
            const inputPass = document.getElementById("pinInput").value;
            const errorText = document.getElementById("errorText");
            const selectedUserId = String(document.getElementById("userSelect").value); 
            
            // ตรวจสอบรหัสผ่านที่ดึงมาจาก Cloud
            const user = ALL_USERS.find(u => (String(u.user) === selectedUserId || String(u.username) === selectedUserId || String(u.id) === selectedUserId));
            
            if (user) {
                const dbPass = String(user.pass || user.password || "");
                if (inputPass === dbPass) {
                    window.location.href = `index.html?user=${encodeURIComponent(user.name || user.fullname)}`;
                    return;
                }
            }
            
            // รหัสผิด
            errorText.style.display = "block";
            document.getElementById("pinInput").value = "";
            document.getElementById("pinInput").focus();
        }

        function checkEnter(event) {
            if (event.key === "Enter") { verifyLogin(); }
        }
    </script>
</body>
</html>
